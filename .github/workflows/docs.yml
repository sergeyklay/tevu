# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Docs

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - package.json
      - .github/workflows/docs.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - package.json
      - .github/workflows/docs.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check README links target this version
        run: |
          version="$(jq -r .version package.json)"
          status=0
          if grep -nP '\]\((?!https?://|#)' README.md; then
            echo "::error file=README.md::Use absolute GitHub URLs; npm does not ship the linked files."
            status=1
          fi
          if grep -noE 'github\.com/sergeyklay/tevu/(blob|tree)/[^/)#]+' README.md | grep -vE "/(blob|tree)/v${version//./\\.}$"; then
            echo "::error file=README.md::Repository links must use the tag v${version}."
            status=1
          fi
          exit "$status"

      - name: Install lychee
        uses: sortie-ai/shared-workflows/.github/actions/setup-lychee@12099056fde09c3b1ef701128316e9fb883eba90 # v1.1.0

      - name: Check links and anchors
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          offline=()
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            offline=(--offline)
          fi
          lychee "${offline[@]}" --no-progress --include-fragments \
            --remap "https://github\.com/sergeyklay/tevu/(blob|tree)/v[^/]+/(.*) file://$GITHUB_WORKSPACE/\$2" \
            README.md CONTRIBUTING.md SECURITY.md RELEASING.md CHANGELOG.md 'docs/**/*.md'
