# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks

      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] || range="$PUSH_BEFORE..$PUSH_AFTER" ;;
          esac
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --verbose --no-banner ${range:+--log-opts="$range"} .

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        working-directory: ${{ runner.temp }}
        run: |
          actionlint="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          zizmor='zizmor-x86_64-unknown-linux-gnu.tar.gz'
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint}"
          curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${zizmor}"
          printf '%s  %s\n%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint" "$ZIZMOR_SHA256" "$zizmor" | sha256sum -c -
          mkdir tools-bin
          tar -xzf "$actionlint" -C tools-bin actionlint
          tar -xzf "$zizmor" -C tools-bin zizmor

      - name: Lint workflows
        run: '"$RUNNER_TEMP/tools-bin/actionlint"'

      - name: Audit workflows and Dependabot configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/tools-bin/zizmor" --format github .github'

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack
        run: |
          bun run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Audit dependencies
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/audit.mjs "$RUNNER_TEMP/tevu-$version.tgz"
