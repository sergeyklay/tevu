# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the checked package on npm; leave unchecked to only verify
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    if: github.repository == 'sergeyklay/tevu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      channel: ${{ steps.check.outputs.channel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Fetch the tag object and main
        env:
          REF: ${{ github.ref }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          refspecs=("+refs/heads/main:refs/remotes/origin/main")
          case "$REF" in
            refs/tags/*) refspecs+=("+$REF:$REF") ;;
          esac
          git fetch --no-tags "$REPOSITORY_URL" "${refspecs[@]}"

      - name: Check the release tag
        id: check
        run: node scripts/check-release.mjs

  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package
          filename="tevu-$VERSION.tgz"
          packed="$(tar -xzOf "package/$filename" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')"
          test "$packed" = "$VERSION"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "package/$filename" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package/${{ steps.pack.outputs.filename }}
          if-no-files-found: error

  package:
    name: Check package (${{ matrix.os }})
    needs: [verify, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Check package
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/package"
          printf '%s  %s\n' "$SHA256" "$FILENAME" | shasum -a 256 -c -
          cd "$GITHUB_WORKSPACE"
          node scripts/check-package.mjs "$RUNNER_TEMP/package/$FILENAME" "$VERSION"

  audit:
    name: Audit dependencies
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Audit dependencies
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/package/$FILENAME" | sha256sum -c -
          node scripts/audit.mjs "$RUNNER_TEMP/package/$FILENAME"

  stage:
    name: Stage on npm
    needs: [verify, build, package, audit]
    if: github.event_name == 'push' || inputs.stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      id-token: write
    env:
      NPM_VERSION: 11.21.0
      NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
      FILENAME: ${{ needs.build.outputs.filename }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      TAG: ${{ needs.verify.outputs.tag }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The tarball is checked against a pinned integrity before it is installed.
      - name: Install npm
        working-directory: ${{ runner.temp }}
        run: | # zizmor: ignore[adhoc-packages]
          npm pack "npm@$NPM_VERSION" --silent
          node -e '
            const [file, expected] = process.argv.slice(1);
            const actual = "sha512-" + require("crypto").createHash("sha512").update(require("fs").readFileSync(file)).digest("base64");
            if (actual !== expected) { console.error(file + " is " + actual + ", expected " + expected); process.exit(1); }
          ' "npm-$NPM_VERSION.tgz" "$NPM_INTEGRITY"
          npm install --global --ignore-scripts "./npm-$NPM_VERSION.tgz"
          hash -r
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Check package
        working-directory: ${{ runner.temp }}/package
        run: |
          printf '%s  %s\n' "$SHA256" "$FILENAME" | sha256sum -c -
          tar -xzOf "$FILENAME" package/package.json | node -e '
            const manifest = JSON.parse(require("fs").readFileSync(0));
            if (manifest.name !== "tevu" || manifest.version !== process.env.VERSION) {
              console.error("package is " + manifest.name + "@" + manifest.version + ", expected tevu@" + process.env.VERSION);
              process.exit(1);
            }
          '

      - name: Stage
        working-directory: ${{ runner.temp }}/package
        run: |
          npm stage publish "./$FILENAME" --ignore-scripts --access public --tag "$CHANNEL" \
            --registry=https://registry.npmjs.org/ --json > "$RUNNER_TEMP/stage.json"

      - name: Record evidence
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs");
            const { env } = process;
            let staged = {};
            try { staged = JSON.parse(fs.readFileSync("stage.json", "utf8")).tevu ?? {}; } catch {}
            const evidence = {
              tag: env.TAG, version: env.VERSION, channel: env.CHANNEL, commit: env.COMMIT, run: env.RUN_URL,
              sha256: env.SHA256, integrity: staged.integrity ?? null, stageId: staged.stageId ?? null,
            };
            fs.writeFileSync("release-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
            const rows = Object.entries(evidence).map(([key, value]) => "| " + key + " | " + value + " |");
            fs.appendFileSync(env.GITHUB_STEP_SUMMARY, ["| Field | Value |", "| --- | --- |", ...rows, ""].join("\n"));
            const local = "sha512-" + require("crypto").createHash("sha512").update(fs.readFileSync("package/" + env.FILENAME)).digest("base64");
            if (!evidence.stageId) { console.error("npm reported no stage ID; check the Stage step and npm stage list tevu"); process.exit(1); }
            if (evidence.integrity !== local) { console.error("npm staged " + evidence.integrity + ", but the checked package is " + local + "; reject the stage"); process.exit(1); }
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/stage.json
          if-no-files-found: warn
