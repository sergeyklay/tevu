# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Dependabot auto-merge

# The called workflow never checks out or runs code from the pull request.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]' }}
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-merge.yml@12099056fde09c3b1ef701128316e9fb883eba90 # v1.1.0
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
