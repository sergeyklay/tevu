name: Bug report
description: Report a reproducible problem with tevu. Not for security vulnerabilities.
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not paste credentials, tokens, private task text, content of a private repository, session exports, or unredacted logs. Replace them with placeholders.

        A credential that reaches tevu's output, or a broken isolation boundary, is a vulnerability: [report it privately](https://github.com/sergeyklay/tevu/security/advisories/new) instead. See [SECURITY.md](https://github.com/sergeyklay/tevu/blob/main/SECURITY.md).
  - type: input
    id: tevu-version
    attributes:
      label: tevu version
      description: Output of `tevu --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v24.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name and version.
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: tevu run --config tevu.yaml
      render: shell
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The smallest configuration and repository state that reproduce the problem, with every secret value, private task text, and private repository content replaced by a placeholder.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the exit code and the relevant output after removing secrets and private content.
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Public content
      options:
        - label: This issue contains no credentials, tokens, private task text, or private repository content.
          required: true
